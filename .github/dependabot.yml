version: 2
updates:
  # Updates go through dev like any other change and ship with the next release.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Riyadh
    # Skip releases younger than this; security updates are not delayed.
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'Dependencies:'
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Riyadh
    cooldown:
      default-days: 7
    labels: [dependencies, ci]
    commit-message:
      prefix: 'CI:'
    groups:
      actions:
        patterns: ['*']
