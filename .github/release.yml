# Each pull request lands in the first category it matches.
changelog:
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Design
      labels: [design]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [docs]
    - title: Other changes
      labels: ['*']
