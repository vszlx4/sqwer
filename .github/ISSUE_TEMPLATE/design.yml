name: Design task (v2)
description: A piece of the React rewrite's design or layout
labels: [v2, design]
body:
  - type: input
    id: surface
    attributes: { label: Page or component, placeholder: "Landing hero, results chart, course map…" }
    validations: { required: true }
  - type: textarea
    id: brief
    attributes: { label: Brief, description: What the visitor needs to do or understand there }
    validations: { required: true }
  - type: textarea
    id: done
    attributes: { label: Done when, placeholder: "Matches DESIGN.md · works at 390 px · keyboard reachable · reduced motion respected" }
