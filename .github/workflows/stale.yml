name: Stale issues and pull requests

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,blocked,feedback
          exempt-pr-labels: security,blocked
          stale-issue-message: This issue has had no activity for 45 days. It will close in 14 days unless there is an update.
          stale-pr-message: This pull request has had no activity for 45 days. It will close in 14 days unless there is an update.
          delete-branch: false
