name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Runs from the base branch; never checks out pull request code.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
