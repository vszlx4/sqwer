name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# pull_request_target runs the workflow from the base branch and never checks out the pull request's code.
permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
      - name: Mark rewrite pull requests
        if: startsWith(github.head_ref, 'v2/') || github.base_ref == 'v2/react-rewrite'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: ['v2'] });
