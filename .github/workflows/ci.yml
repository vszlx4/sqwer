# Audit, type check, unit tests and build on main, dev and their pull requests. E2E runs locally.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required status check in the ruleset.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type check
        run: npm run check -w web
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build -w web
        env:
          PUBLIC_SITE_URL: https://sqwer.invalid
