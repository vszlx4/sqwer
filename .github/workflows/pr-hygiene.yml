name: Pull request hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check branch name and title
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          fail=0
          # main takes releases from dev and hotfixes only; everything else goes to dev.
          if [ "$BASE" = main ]; then
            if ! [[ "$HEAD" == dev || "$HEAD" =~ ^(fix|security)/[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Pull requests into main come from dev (releases) or fix/ and security/ hotfixes. Target dev instead."
              fail=1
            fi
          elif ! [[ "$HEAD" =~ ^(feat|fix|docs|chore|refactor|test|design|security)/[a-z0-9][a-z0-9-]*$ || "$HEAD" =~ ^dependabot/ ]]; then
            echo "::error::Branch '$HEAD' must look like feat/short-name, fix/short-name, docs/..., chore/..., refactor/..., test/..., design/..., security/...."
            fail=1
          fi
          # Title: 10-100 characters, no trailing full stop.
          if [ ${#TITLE} -lt 10 ] || [ ${#TITLE} -gt 100 ] || [[ "$TITLE" == *. ]]; then
            echo "::error::Title '$TITLE' should be 10-100 characters, say what changes, and not end with a full stop."
            fail=1
          fi
          exit $fail
